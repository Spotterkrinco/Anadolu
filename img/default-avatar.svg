<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162342"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" stroke="#223354" stroke-width="3"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(59,130,246,0.15)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Radar sweep line (faint) -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Head -->
  <circle cx="100" cy="74" r="32" fill="#2a3f68" stroke="#3b568c" stroke-width="2"/>

  <!-- Aviator Sunglasses / Visor -->
  <path d="M 82 72 Q 91 69 100 72 Q 109 69 118 72 Q 120 83 114 87 Q 106 91 101 84 Q 100 82 99 84 Q 94 91 86 87 Q 80 83 82 72 Z" fill="#0f172a" stroke="#e8530e" stroke-width="1.5"/>
  <line x1="97" y1="73" x2="103" y2="73" stroke="#e8530e" stroke-width="2"/>
  <!-- Sunglasses lens shine -->
  <path d="M 85 75 L 90 75 L 87 83 L 83 83 Z" fill="rgba(255,255,255,0.35)"/>
  <path d="M 107 75 L 112 75 L 109 83 L 105 83 Z" fill="rgba(255,255,255,0.35)"/>

  <!-- Shoulders & Torso with flight jacket collar -->
  <path d="M 44 162 C 44 126 70 114 100 114 C 130 114 156 126 156 162 C 156 172 142 176 100 176 C 58 176 44 172 44 162 Z" fill="#1e2e4e" stroke="#2d4370" stroke-width="2"/>

  <!-- Collar / Tie / Flight Suit V -->
  <path d="M 88 115 L 100 142 L 112 115" fill="none" stroke="#e8530e" stroke-width="2" stroke-linecap="round"/>
  <polygon points="97,136 103,136 102,154 98,154" fill="#f59e0b"/>

  <!-- Small wings badge on chest -->
  <g transform="translate(100, 160) scale(0.6)">
    <path d="M 0 -4 L 8 -1 L 22 -6 L 16 2 L 6 3 L 0 5 L -6 3 L -16 2 L -22 -6 L -8 -1 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Aviation Headset Band & Ear Cups -->
  <path d="M 68 76 C 66 45 134 45 132 76" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left earcup -->
  <rect x="63" y="66" width="9" height="20" rx="4" fill="#e8530e" stroke="#ffffff" stroke-width="1"/>
  <!-- Right earcup -->
  <rect x="128" y="66" width="9" height="20" rx="4" fill="#e8530e" stroke="#ffffff" stroke-width="1"/>
  <!-- Headset boom mic -->
  <path d="M 68 83 Q 72 96 84 96" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="85" cy="96" r="3" fill="#0f172a"/>
</svg>
