<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Üyeler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef2f5;--surface:#fff;--ink:#14202b;--muted:#5b6b79;--line:#d3dce3;--sky:#1f6f9c;--sky-soft:#dcecf5;--amber:#b86e00;--amber-soft:#fdeccb;--focus:#1f6f9c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--surface:#16212d;--ink:#e8eef3;--muted:#93a3b1;--line:#2a3948;--sky:#6bb6e0;--sky-soft:#1b3446;--amber:#f2b34a;--amber-soft:#3b2d12;--focus:#6bb6e0}}
:root[data-theme="dark"]{--bg:#0e1620;--surface:#16212d;--ink:#e8eef3;--muted:#93a3b1;--line:#2a3948;--sky:#6bb6e0;--sky-soft:#1b3446;--amber:#f2b34a;--amber-soft:#3b2d12;--focus:#6bb6e0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:1080px;margin:0 auto;padding:32px 20px 56px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;margin:0 0 6px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 24px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.search{flex:1 1 240px;min-width:0;padding:12px 14px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:500;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip span{opacity:.65;margin-left:4px}
:is(.search,.chip,.card a):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.count{color:var(--muted);margin:0 0 18px;font-weight:500}
.count b{color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:1.5rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;gap:14px;align-items:center;padding:16px 16px 14px}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--sky-soft);color:var(--sky);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem}
.manager .av{background:var(--amber-soft);color:var(--amber)}
.who{min-width:0}
.nm{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere;line-height:1.25}
.tag{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:600;background:var(--sky-soft);color:var(--sky)}
.manager .tag{background:var(--amber-soft);color:var(--amber)}
.card a{margin-top:auto;display:block;padding:12px 16px;border-top:1px dashed var(--line);color:var(--ink);font-weight:600;text-decoration:none}
.card a:hover{background:var(--sky-soft)}
.empty{padding:40px 0;color:var(--muted);text-align:center}
@media (max-width:520px){main{padding:24px 14px 40px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Üyeler</h1>
<p class="sub">Topluluğun tüm üyeleri ve mevkileri.</p>
<div class="bar">
<input class="search" id="q" type="search" placeholder="İsimle üye ara" aria-label="İsimle üye ara" autocomplete="off">
<div class="chips" id="chips" role="group" aria-label="Mevkiye göre filtrele"></div>
</div>
<p class="count" aria-live="polite" id="count"></p>
<ul class="grid" id="grid"></ul>
<p class="empty" id="empty" hidden>Aramanıza uyan üye bulunamadı. Aramayı değiştirin veya filtreyi “Tümü” yapın.</p>
</main>
<script>
const MEMBERS=[{"n": "spoterkrinco", "l": "https://www.instagram.com/spoterkrinco/", "r": "Manager"}, {"n": "spottingdeniz", "l": "https://www.instagram.com/spottingdeniz/", "r": "Member"}, {"n": "spotter5858", "l": "https://www.instagram.com/spotter5858/", "r": "Member"}, {"n": "ltauspotter", "l": "https://www.instagram.com/ltauspotter/", "r": "Member"}, {"n": "ctnaviation", "l": "https://www.instagram.com/ctnaviation/", "r": "Member"}, {"n": "izmirspotterkemal", "l": "https://www.instagram.com/izmirspotterkemal/", "r": "Member"}, {"n": "cinarspotting", "l": "https://www.instagram.com/cinarspotting/", "r": "Manager"}, {"n": "aerocraftspotter", "l": "https://www.instagram.com/aerocraftspotter/", "r": "Member"}, {"n": "aliefe_aviation1", "l": "https://www.instagram.com/aliefe_aviation1/", "r": "Member"}, {"n": "yagizspotter", "l": "https://www.instagram.com/yagizspotter/", "r": "Manager"}, {"n": "ltai_sptr", "l": "https://www.instagram.com/ltai_sptr/", "r": "Member"}, {"n": "egephotographer976", "l": "https://www.instagram.com/egephotographer976/", "r": "Member"}, {"n": "planespotterkerim", "l": "https://www.instagram.com/planespotterkerim/", "r": "Member"}, {"n": "flightnumberturk57", "l": "https://www.instagram.com/flightnumberturk57/", "r": "Member"}, {"n": "spotterahmet58", "l": "https://www.instagram.com/spotterahmet58/", "r": "Member"}, {"n": "spotterkutay", "l": "https://www.instagram.com/spotterkutay/", "r": "Member"}, {"n": "spotter_taha1", "l": "https://www.instagram.com/spotter_taha1/", "r": "Member"}, {"n": "emrespotter", "l": "https://www.instagram.com/emrespotter/", "r": "Member"}, {"n": "aviation.t.t", "l": "https://www.instagram.com/aviation.t.t/", "r": "Member"}, {"n": "spoting_in_cappadocia", "l": "https://www.instagram.com/spoting_in_cappadocia/", "r": "Member"}, {"n": "ozturkspotter", "l": "https://www.instagram.com/ozturkspotter/", "r": "Member"}, {"n": "flaps_andframes", "l": "https://www.instagram.com/flaps_andframes/", "r": "Member"}, {"n": "memospotting", "l": "https://www.instagram.com/memospotting/", "r": "Member"}, {"n": "berkxzaviation3", "l": "https://www.instagram.com/berkxzaviation3/", "r": "Member"}, {"n": "spotter_ruzgar", "l": "https://www.instagram.com/spotter_ruzgar/", "r": "Manager"}, {"n": "aviation_gunnar", "l": "https://www.instagram.com/aviation_gunnar/", "r": "Member"}, {"n": "spotter_keremm", "l": "https://www.instagram.com/spotter_keremm/", "r": "Member"}, {"n": "spotteryusuf1", "l": "https://www.instagram.com/spotteryusuf1/", "r": "Manager"}, {"n": "spottereymen6", "l": "https://www.instagram.com/spottereymen6/", "r": "Member"}, {"n": "burakspotter_", "l": "https://www.instagram.com/burakspotter_/", "r": "Member"}, {"n": "spotter_buyrucu", "l": "https://www.instagram.com/spotter_buyrucu/", "r": "Member"}, {"n": "ncxq_spotting", "l": "https://www.instagram.com/ncxq_spotting/", "r": "Member"}];
const q=document.getElementById('q'),grid=document.getElementById('grid'),chips=document.getElementById('chips'),count=document.getElementById('count'),empty=document.getElementById('empty');
const roles=[...new Set(MEMBERS.map(m=>m.r))];
let role='Tümü';
function norm(s){return s.toLocaleLowerCase('tr').replace(/[^a-z0-9ğüşöçıi]/g,'')}
function mkChip(label,n){const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed',label===role);b.append(label);const s=document.createElement('span');s.textContent=n;b.append(s);b.onclick=()=>{role=label;renderChips();render()};return b}
function renderChips(){chips.replaceChildren(mkChip('Tümü',MEMBERS.length),...roles.map(r=>mkChip(r,MEMBERS.filter(m=>m.r===r).length)))}
function card(m){
const li=document.createElement('li');li.className='card'+(m.r==='Manager'?' manager':'');
const top=document.createElement('div');top.className='top';
const av=document.createElement('div');av.className='av';av.setAttribute('aria-hidden','true');av.textContent=m.n.replace(/[^a-zA-Z0-9]/g,'').slice(0,2).toUpperCase();
const who=document.createElement('div');who.className='who';
const nm=document.createElement('div');nm.className='nm';nm.textContent=m.n;
const tag=document.createElement('span');tag.className='tag';tag.textContent=m.r;
who.append(nm,tag);top.append(av,who);
const a=document.createElement('a');a.href=m.l;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Profili aç';a.setAttribute('aria-label',m.n+' profilini yeni sekmede aç');
li.append(top,a);return li}
function render(){
const t=norm(q.value);
const list=MEMBERS.filter(m=>(role==='Tümü'||m.r===role)&&(!t||norm(m.n).includes(t)));
grid.replaceChildren(...list.map(card));
count.replaceChildren();
const b=document.createElement('b');b.textContent=list.length;
count.append(b,' / '+MEMBERS.length+' üye gösteriliyor');
empty.hidden=list.length>0}
q.addEventListener('input',render);
renderChips();render();
</script>
</body>
</html>
